<!DOCTYPE html>
<html lang="es" class="h-100"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Docentes - Gestión Docente</title>

    <link th:href="@{/css/bootstrap.min.css}"
          rel="stylesheet">
</head>

<body class="d-flex flex-column h-100">

    <!-- MENÚ PRINCIPAL -->
    <header th:insert="~{fragments/menu :: menu-principal}">
    </header>

    <!-- CONTENIDO -->
    <main class="flex-shrink-0">

        <div class="container py-4">

            <!-- TÍTULO Y BOTÓN NUEVO -->
            <div class="d-flex justify-content-between align-items-center mb-3">

                <h1 class="h3 mb-0">
                    Docentes
                </h1>

                <a th:href="@{/docentes/nuevo}"
                   class="btn btn-primary">
                    Nuevo docente
                </a>

            </div>

            <!-- BUSCADOR -->
            <form th:action="@{/docentes}"
                  method="get"
                  class="d-flex gap-2 mb-3">

                <input type="text"
                       name="buscar"
                       th:value="${buscar}"
                       class="form-control"
                       placeholder="Buscar por apellido, nombre o DNI">

                <button type="submit"
                        class="btn btn-outline-primary">
                    Buscar
                </button>

                <a th:href="@{/docentes}"
                   class="btn btn-outline-secondary">
                    Ver todos
                </a>

            </form>

            <!-- TABLA DE DOCENTES -->
            <table class="table table-striped table-hover">

                <thead>
                    <tr>
                        <th>Apellido y nombre</th>
                        <th>DNI</th>
                        <th>CUIT</th>
                        <th>Estado</th>
                        <th class="text-end">
                            Acciones
                        </th>
                    </tr>
                </thead>

                <tbody>

                    <!-- SIN RESULTADOS -->
                    <tr th:if="${docentes.isEmpty()}">
                        <td colspan="5"
                            class="text-muted">
                            No se encontraron docentes.
                        </td>
                    </tr>

                    <!-- LISTADO -->
                    <tr th:each="d : ${docentes}">

                        <td th:text="${d.apellido + ', ' + d.nombre}">
                        </td>

                        <td th:text="${d.dni}">
                        </td>

                        <td th:text="${d.cuit}">
                        </td>

                        <td th:text="${d.estado}">
                        </td>

                        <td class="text-end">

                            <!-- EDITAR -->
                            <a th:href="@{/docentes/editar/{id}(id=${d.idDocente})}"
                               class="btn btn-sm btn-outline-primary">
                                Editar
                            </a>

                            <!-- DAR DE BAJA -->
                            <form th:if="${d.estado == 'Activo'}"
                                  th:action="@{/docentes/baja/{id}(id=${d.idDocente})}"
                                  method="post"
                                  class="d-inline">

                                <button type="submit"
                                        class="btn btn-sm btn-outline-danger">
                                    Dar de baja
                                </button>

                            </form>

                            <!-- REACTIVAR -->
                            <form th:if="${d.estado == 'Inactivo'}"
                                  th:action="@{/docentes/reactivar/{id}(id=${d.idDocente})}"
                                  method="post"
                                  class="d-inline">

                                <button type="submit"
                                        class="btn btn-sm btn-outline-success">
                                    Reactivar
                                </button>

                            </form>

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </main>

    <!-- PIE DE PÁGINA -->
    <footer class="footer mt-auto py-3 bg-light"
            th:insert="~{fragments/footer :: pie-pagina}">
    </footer>

    <!-- BOOTSTRAP -->
    <script th:src="@{/js/bootstrap.min.js}">
    </script>

</body>
</html>
