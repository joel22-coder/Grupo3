<!DOCTYPE html>
<html lang="es" class="h-100" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Asistencias - Gestión Docente</title>

    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
</head>

<body class="d-flex flex-column h-100">

    <header th:insert="~{fragments/menu :: menu-principal}"></header>

    <main class="flex-shrink-0">

        <div class="container py-4">

            <div class="d-flex justify-content-between align-items-center mb-3">

                <h1 class="h3 mb-0">Asistencias de docentes</h1>

                <a th:href="@{/asistencias/nueva}"
                   class="btn btn-primary">
                    Nueva asistencia
                </a>

            </div>

            <div th:if="${mensaje != null}"
                 class="alert alert-success"
                 th:text="${mensaje}">
            </div>

            <table class="table table-striped table-hover">

                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Docente</th>
                        <th>Estado</th>
                        <th>Observaciones</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:if="${asistencias.isEmpty()}">
                        <td colspan="5" class="text-muted">
                            No hay asistencias registradas.
                        </td>
                    </tr>

                    <tr th:each="a : ${asistencias}">

                        <td th:text="${#temporals.format(a.fecha, 'dd/MM/yyyy')}">
                        </td>

                        <td th:text="${a.docente.apellido + ', ' + a.docente.nombre}">
                        </td>

                        <td>

                            <span th:if="${a.estado == 'Presente'}"
                                  class="badge bg-success"
                                  th:text="${a.estado}">
                            </span>

                            <span th:if="${a.estado == 'Ausente'}"
                                  class="badge bg-danger"
                                  th:text="${a.estado}">
                            </span>

                            <span th:if="${a.estado == 'Justificado'}"
                                  class="badge bg-warning text-dark"
                                  th:text="${a.estado}">
                            </span>

                        </td>

                        <td th:text="${a.observacion != null
                            and !a.observacion.isEmpty()
                            ? a.observacion : '-'}">
                        </td>

                        <td class="text-end">

                            <a th:href="@{/asistencias/editar/{id}(id=${a.idAsistencia})}"
                               class="btn btn-sm btn-outline-primary">
                                Editar
                            </a>

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </main>

    <footer class="footer mt-auto py-3 bg-light"
            th:insert="~{fragments/footer :: pie-pagina}">
    </footer>

    <script th:src="@{/js/bootstrap.min.js}"></script>

</body>
</html>
