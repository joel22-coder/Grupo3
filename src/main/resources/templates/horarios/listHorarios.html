<!DOCTYPE html>
<html lang="es" class="h-100" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Horarios - Gestión Docente</title>
	<link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
</head>

<body class="d-flex flex-column h-100">

	<header th:insert="~{fragments/menu :: menu-principal}"></header>

	<main class="flex-shrink-0">
		<div class="container py-4">

			<div class="d-flex justify-content-between align-items-center mb-3">
				<h1 class="h3 mb-0">Horarios</h1>
				<a th:href="@{/horarios/nuevo}" class="btn btn-primary">Nuevo horario</a>
			</div>

			<table class="table table-striped table-hover">
				<thead>
					<tr>
						<th>Día</th>
						<th>Horario</th>
						<th>Materia</th>
						<th>Plan</th>
						<th>Docente</th>
						<th>Estado</th>
						<th class="text-end">Acciones</th>
					</tr>
				</thead>
				<tbody>
					<tr th:if="${horarios.isEmpty()}">
						<td colspan="7" class="text-muted">No hay horarios cargados.</td>
					</tr>
					<tr th:each="h : ${horarios}">
						<td th:text="${h.diaSemana}"></td>
						<td><span th:text="${h.horaInicio}"></span> a <span th:text="${h.horaFin}"></span></td>
						<td th:text="${h.materia.codigo + ' - ' + h.materia.nombre}"></td>
						<td th:text="${h.materia.planEstudio.nombre}"></td>
						<td th:text="${h.docente.apellido + ', ' + h.docente.nombre}"></td>
						<td th:text="${h.estado}"></td>
						<td class="text-end">
							<a th:href="@{/horarios/editar/{id}(id=${h.idHorario})}"
								class="btn btn-sm btn-outline-primary">Editar</a>
							<form th:action="@{/horarios/eliminar/{id}(id=${h.idHorario})}" method="post"
								class="d-inline">
								<button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
							</form>
						</td>
					</tr>
				</tbody>
			</table>

		</div>
	</main>

	<footer class="footer mt-auto py-3 bg-light" th:insert="~{fragments/footer :: pie-pagina}"></footer>

	<script th:src="@{/js/bootstrap.min.js}"></script>
</body>

</html>
