<!DOCTYPE html>
<html lang="es" class="h-100" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Carreras - Gestión Docente</title>
	<link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body class="d-flex flex-column h-100">

	<header th:insert="~{fragments/menu :: menu-principal}"></header>

	<main class="flex-shrink-0">
		<div class="container py-4">

			<div class="d-flex justify-content-between align-items-center mb-3">
				<h1 class="h3 mb-0">Carreras</h1>
				<a th:href="@{/carreras/nueva}" class="btn btn-primary">Nueva carrera</a>
			</div>

			<table class="table table-striped table-hover">
				<thead>
					<tr>
						<th>Nombre</th>
						<th>Duración (años)</th>
						<th class="text-end">Acciones</th>
					</tr>
				</thead>
				<tbody>
					<tr th:if="${carreras.isEmpty()}">
						<td colspan="3" class="text-muted">No hay carreras cargadas.</td>
					</tr>
					<tr th:each="c : ${carreras}">
						<td th:text="${c.nombre}"></td>
						<td th:text="${c.duracion}"></td>
						<td class="text-end">
							<a th:href="@{/carreras/editar/{id}(id=${c.idCarrera})}"
							   class="btn btn-sm btn-outline-primary">Editar</a>
							<form th:action="@{/carreras/eliminar/{id}(id=${c.idCarrera})}"
								  method="post" class="d-inline">
								<button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
							</form>
						</td>
					</tr>
				</tbody>
			</table>

		</div>
	</main>

	<footer class="footer mt-auto py-3 bg-light" th:insert="~{fragments/footer :: pie-pagina}"></footer>

	<script th:src="@{/js/bootstrap.min.js}"></script>
</body>
</html>
