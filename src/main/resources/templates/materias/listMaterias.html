<!DOCTYPE html>
<html lang="es" class="h-100" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Materias - Gestión Docente</title>
	<link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body class="d-flex flex-column h-100">

	<header th:insert="~{fragments/menu :: menu-principal}"></header>

	<main class="flex-shrink-0">
		<div class="container py-4">

			<div class="d-flex justify-content-between align-items-center mb-3">
				<h1 class="h3 mb-0">Materias</h1>
				<a th:href="@{/materias/nueva}" class="btn btn-primary">Nueva materia</a>
			</div>

			<table class="table table-striped table-hover">
				<thead>
					<tr>
						<th>Código</th>
						<th>Materia</th>
						<th>Plan de estudio</th>
						<th>Año</th>
						<th>Cursado</th>
						<th>Horas sem.</th>
						<th class="text-end">Acciones</th>
					</tr>
				</thead>
				<tbody>
					<tr th:if="${materias.isEmpty()}">
						<td colspan="7" class="text-muted">No hay materias cargadas.</td>
					</tr>
					<tr th:each="m : ${materias}">
						<td th:text="${m.codigo}"></td>
						<td th:text="${m.nombre}"></td>
						<td th:text="${m.planEstudio.nombre}"></td>
						<td th:text="${m.curso}"></td>
						<td th:text="${m.tipoCursado}"></td>
						<td th:text="${m.horasSemanales}"></td>
						<td class="text-end">
							<a th:href="@{/materias/editar/{id}(id=${m.idMateria})}"
							   class="btn btn-sm btn-outline-primary">Editar</a>
							<form th:action="@{/materias/eliminar/{id}(id=${m.idMateria})}"
								  method="post" class="d-inline">
								<button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
							</form>
						</td>
					</tr>
				</tbody>
			</table>

		</div>
	</main>

	<footer class="footer mt-auto py-3 bg-light" th:insert="~{fragments/footer :: pie-pagina}"></footer>

	<script th:src="@{/js/bootstrap.min.js}"></script>
</body>
</html>
